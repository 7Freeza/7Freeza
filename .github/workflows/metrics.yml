name: metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: America/Bogota
          config_display: regular
          base: header, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          output_action: none
          filename: github-metrics.svg

      - name: Recolor en gris y subir
        shell: bash
        run: |
          set -e
          SRCFILE="$(find /metrics_renders -name 'github-metrics.svg' | head -n1)"
          echo "source: $SRCFILE"
          cp "$SRCFILE" ./github-metrics.svg
          python3 - "$PWD/github-metrics.svg" <<'PY'
          import sys
          ramp = {
            '#ebedf0': '#21262d',
            '#c6e48b': '#30363d',
            '#7bc96f': '#3f4850',
            '#9be9a8': '#30363d',
            '#40c463': '#484f58',
            '#30a14e': '#6e7681',
            '#216e39': '#8b949e',
            '#0366d6': '#8b949e',
            '#666':     '#8b949e',
            '#777':     '#959da5',
          }
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          for a, b in ramp.items():
              s = s.replace(a, b)
          open(p, 'w', encoding='utf-8').write(s)
          print('recolor done')
          PY

      - name: Commit del SVG
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const path = 'github-metrics.svg';
            const content = fs.readFileSync(path, 'utf8');
            if (!content.includes('#21262d')) {
              throw new Error('El archivo no fue recolorado');
            }
            const res = await github.rest.repos.getContent({ owner, repo, path }).catch(() => null);
            const current = res ? Buffer.from(res.data.content, 'base64').toString('utf8') : null;
            if (current === content) {
              console.log('sin cambios, se omite el commit');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'chore: actualizar metricas [skip ci]',
              content: Buffer.from(content).toString('base64'),
              sha: res ? res.data.sha : undefined,
            });